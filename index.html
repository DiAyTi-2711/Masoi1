<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1124">
<title>Ma Sói</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  /* Bầu trời đổi theo pha: đêm chàm sâu, ngày nâu than hồng */
  --sky:#0e1124; --sky-2:#171b36; --glow:rgba(230,222,203,.10);
  --card:rgba(255,255,255,.045); --card-2:rgba(255,255,255,.08); --line:rgba(230,222,203,.13);
  --bone:#e6decb; --mist:#9a9db5; --faint:#5f6380;
  --lantern:#e8a84a; --blood:#c8414b; --pine:#4e9c8f; --violet:#9c86e8;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
body.day{ --sky:#1c1510; --sky-2:#2b1f15; --glow:rgba(232,168,74,.16); }
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  font:16px/1.5 var(--sans); color:var(--bone);
  background:radial-gradient(120% 60% at 85% -10%, var(--glow), transparent 60%),
             linear-gradient(180deg,var(--sky-2),var(--sky) 55%);
  background-attachment:fixed; background-color:var(--sky);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  transition:background-color .8s;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:520px;margin:0 auto;padding:16px 16px 110px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2}
small,.muted{color:var(--mist)}

/* --- nút & ô nhập: vùng chạm tối thiểu 52px --- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;
  padding:0 20px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--lantern);color:#24170a;border-color:transparent}
.btn.danger{background:var(--blood);color:#fff;border-color:transparent}
.btn:disabled{opacity:.4}
.btn+.btn{margin-top:10px}
.field{display:block;margin:14px 0}
.field span{display:block;font-size:14px;color:var(--mist);margin-bottom:6px}
input{width:100%;min-height:54px;padding:0 16px;border-radius:14px;border:1px solid var(--line);
  background:rgba(0,0,0,.25);color:var(--bone);font:inherit;font-size:18px}
#code{letter-spacing:.3em;font-weight:700;text-transform:uppercase}

/* --- màn hình chính --- */
.home{padding-top:12vh}
.moon{width:92px;height:92px;border-radius:50%;margin-bottom:28px;
  background:radial-gradient(circle at 35% 35%,#f3ecd9,#cfc5ab 60%,#a99f86);
  box-shadow:0 0 60px rgba(243,236,217,.25)}
.title{font-size:56px;letter-spacing:-.01em}
.sub{color:var(--mist);margin:6px 0 28px}
.or{text-align:center;color:var(--faint);margin:22px 0 4px;font-size:14px}

/* --- thanh trên cùng --- */
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.bar h2{font-size:22px}
.bar .meta{color:var(--mist);font-size:14px}
.timer{font:700 22px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--lantern)}
.timer.urgent{color:var(--blood)}

/* --- phòng chờ --- */
.invite{display:flex;gap:16px;align-items:center;padding:16px;border-radius:18px;
  background:var(--card);border:1px solid var(--line);margin-bottom:20px}
.qr{flex:none;width:132px;aspect-ratio:1;border-radius:12px;background:#f4efe2;padding:6px;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.qr svg path{fill:#14101f}
.invite .info{flex:1;min-width:0}
.invite b{display:block;font:700 34px/1.1 var(--serif);letter-spacing:.12em;margin:2px 0 6px}
.invite .url{font-size:13px;color:var(--mist);word-break:break-all}
.invite .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.invite .links button{padding:9px 12px;border-radius:10px;background:var(--card-2);font-size:14px}
.qr-full{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:24px;background:#f4efe2;color:#14101f;text-align:center}
.qr-full .qr{width:min(84vw,420px);background:none;padding:0}
.qr-full b{font:700 44px/1 var(--serif);letter-spacing:.14em}
.qr-full p{font-size:15px;max-width:32ch}
.codebox{display:flex;align-items:center;justify-content:space-between;padding:18px;border-radius:18px;
  background:var(--card);border:1px solid var(--line);margin-bottom:20px}
.codebox b{font:700 40px/1 var(--serif);letter-spacing:.12em}
.codebox button{padding:10px 14px;border-radius:12px;background:var(--card-2);font-size:14px}
.section{margin:24px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.section h3{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chip.off{opacity:.45}
.chip .host{color:var(--lantern)}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ricon{font-size:26px;width:36px;text-align:center}
.rinfo{flex:1;min-width:0}
.rinfo small{display:block;font-size:13px;line-height:1.35}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--card-2);font-size:22px}
.stepper output,.count{min-width:28px;text-align:center;font-weight:700;font-size:18px}
.total{padding:12px 14px;border-radius:12px;margin:14px 0;font-size:15px;background:var(--card)}
.total.bad{color:#f0a3a8;background:rgba(200,65,75,.14)}
.total.ok{color:#9fd8cf;background:rgba(78,156,143,.14)}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;min-height:44px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px}
.seg button.on{background:var(--bone);color:var(--sky)}
.opt{margin:14px 0}
.opt>span{font-size:14px;color:var(--mist)}
.toggle{padding:0;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;text-align:left}
.toggle i{width:48px;height:28px;border-radius:99px;background:var(--card-2);position:relative;flex:none}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mist);transition:.2s}
.toggle.on i{background:var(--pine)}.toggle.on i::after{left:23px;background:#fff}

/* --- trong ván --- */
.stage{text-align:center;padding:9vh 8px 6vh}
.stage .big{font-size:64px;line-height:1}
.stage h2{font-size:30px;margin:18px 0 8px}
.stage p{color:var(--mist);max-width:30ch;margin:0 auto}
.headline{font:500 24px/1.4 var(--serif);text-align:center;padding:8vh 8px;text-wrap:balance}
.panel h2{font-size:26px;margin-bottom:4px}
.panel>p{color:var(--mist);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;
  border-radius:16px;background:var(--card);border:1.5px solid var(--line);min-height:104px}
.pcard.sel{border-color:var(--lantern);background:rgba(232,168,74,.13)}
.pcard.dead{opacity:.35}
.pcard.dead .pn{text-decoration:line-through}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;
  background:var(--card-2);font-size:17px}
.pn{font-size:14px;line-height:1.2;text-align:center;word-break:break-word}
.badge{position:absolute;top:6px;right:6px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;
  background:var(--blood);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.who{font-size:11px;color:#f0a3a8;line-height:1.2;text-align:center}
.confirm{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));
  background:linear-gradient(transparent,var(--sky) 30%);z-index:5}
.confirm .btn{max-width:488px;margin:0 auto}
.result{padding:22px;border-radius:18px;background:var(--card);border:1px solid var(--line);
  font:500 22px/1.4 var(--serif);text-align:center;margin:12px 0 18px}
.potion{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.potion h3{font-size:18px;margin-bottom:6px}
.potion p{color:var(--mist);margin-bottom:12px}
.dead-banner{padding:12px 14px;border-radius:12px;background:rgba(200,65,75,.14);color:#f0a3a8;margin-bottom:16px;font-size:15px}
.tally{margin-top:20px}
.tally div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
details.log{margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
details.log summary{color:var(--mist);font-size:14px;min-height:44px;display:flex;align-items:center}
details.log p{font-size:15px;padding:6px 0;color:var(--bone)}

/* --- vai bí mật: giữ để xem --- */
.role-btn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0));
  min-height:54px;padding:0 24px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;z-index:4;
  user-select:none;-webkit-user-select:none;touch-action:none;white-space:nowrap}
body.has-confirm .role-btn{display:none}
.reveal{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;background:var(--sky);pointer-events:none}
.reveal.show{display:flex}
.reveal .big{font-size:84px}
.reveal h2{font-size:40px;margin:12px 0 6px}
.reveal .team{font-size:15px;margin-bottom:14px}
.reveal ul{list-style:none;padding:0;max-width:34ch;color:var(--mist);font-size:15px}
.reveal li{padding:4px 0}
.t-wolf{color:var(--blood)}.t-village{color:var(--pine)}

/* --- kết thúc --- */
.win{text-align:center;padding:6vh 0 3vh}
.win .big{font-size:72px}
.win h2{font-size:34px;margin-top:10px}
.roster div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.roster .dead{opacity:.55;text-decoration:line-through}

.ghead{font:600 15px/1.3 var(--sans);color:var(--mist);margin:20px 0 8px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;
  background:var(--card);border:1.5px solid var(--line);min-height:64px}
.rcard.on{border-color:var(--lantern);background:rgba(232,168,74,.10)}
.rcard .check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;
  flex:none;font-weight:700;color:#24170a}
.rcard.on .check{background:var(--lantern);border-color:var(--lantern)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.presets button{padding:9px 12px;border-radius:10px;background:var(--card-2);font-size:14px}
.choices{display:flex;flex-direction:column;gap:10px}
.confirm .row{display:flex;gap:10px;max-width:488px;margin:0 auto}
.confirm .row .btn{margin:0}
.potion .btn+.btn{margin-top:8px}
.t-third{color:var(--violet)}
.narr-stage{text-align:center;padding:4vh 0 2vh}
.narr-stage .big{font-size:56px;line-height:1}
.narr-stage h2{font-size:30px;margin:12px 0 6px}
.narr-timer{font:700 72px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--lantern);margin:10px 0}
.narr-timer.urgent{color:var(--blood)}
.subtitle{min-height:5.6em;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);
  font:500 21px/1.45 var(--serif);text-align:center;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.narr-tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.narr-tools .btn{margin:0}
.audio-box{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin:18px 0}
.audio-box h3{font-size:18px;margin-bottom:6px}
.audio-box p{color:var(--mist);font-size:14px;margin-bottom:10px}
select{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);
  color:var(--bone);font:inherit;padding:0 12px;margin-bottom:10px}
.warn{color:#f0c38a;font-size:14px;margin:8px 0}
.recap h4{font:600 15px/1.3 var(--sans);color:var(--lantern);margin:16px 0 4px}
.recap p{font-size:15px;padding:4px 0;border-bottom:1px solid var(--line)}
.unlock{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;
  padding:24px;text-align:center;background:var(--sky)}
.scripts{margin:18px 0;padding:4px 16px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.scripts summary{min-height:52px;display:flex;align-items:center;font-weight:600}
.scripts h4{font:600 14px/1.3 var(--sans);color:var(--lantern);margin:18px 0 6px}
.sline{padding:10px 0;border-bottom:1px solid var(--line)}
.sline label{display:block;font-size:14px;color:var(--mist);margin-bottom:6px}
.sline label b{color:var(--bone);font-weight:600}
.sline textarea{width:100%;min-height:96px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.25);color:var(--bone);font:inherit;font-size:16px;line-height:1.4;resize:vertical}
.sline.custom textarea{border-color:var(--lantern)}
.sline .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.sline .tools button{min-height:36px;padding:0 10px;border-radius:9px;background:var(--card-2);font-size:13px}
.sline .tools .ph{background:rgba(232,168,74,.14);color:var(--lantern)}
.sline .bad{color:#f0a3a8;font-size:13px;margin-top:4px}
.score{width:100%;border-collapse:collapse;font-size:14px}
.score th{color:var(--mist);font-weight:600;text-align:right;padding:6px 4px;font-size:12px}
.score th:first-child,.score th:nth-child(2){text-align:left}
.score td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.score td:first-child{text-align:left;width:34px}
.score td.n{text-align:left}
.score tr.me td{color:var(--lantern);font-weight:700}
.score td small{display:block;color:var(--mist);font-weight:400;font-size:12px}
.gain{font-weight:700}
.gain.plus{color:#9fd8cf}
.rules{font-size:13px;color:var(--mist);margin:6px 0 10px}
/* ---- phòng chờ của quản trò: gọn, chia tab ---- */
.hl-head{display:flex;gap:14px;align-items:center;padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.hl-qr{flex:none;width:84px;height:84px;border-radius:14px;background:#f4efe2;padding:5px;display:grid;place-items:center}
.hl-qr svg{width:100%;height:100%}.hl-qr svg path{fill:#14101f}
.hl-info{flex:1;min-width:0}
.hl-code{font:700 30px/1 var(--serif);letter-spacing:.12em}
.hl-meta{color:var(--mist);font-size:13px;margin:6px 0 8px}
.hl-actions{display:flex;gap:6px}
.hl-actions button{flex:1;min-height:36px;border-radius:10px;background:var(--card-2);font-size:13px;white-space:nowrap}
.tabs{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;margin:16px -4px 18px;
  border-radius:16px;background:color-mix(in srgb,var(--sky) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line)}
.tabs button{min-height:52px;border-radius:12px;font-size:12px;color:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button b{font-size:18px;line-height:1}
.tabs button.on{background:var(--bone);color:var(--sky);font-weight:700}
.tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--blood);display:inline-block;margin-left:3px;vertical-align:middle}
.glabel{font-size:13px;color:var(--mist);margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.group{border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-top:1px solid var(--line)}
.grow:first-child{border-top:0}
.grow .gi{font-size:20px;width:28px;text-align:center;flex:none}
.grow .gt{flex:1;min-width:0}
.grow .gt b{display:block;font-weight:600;font-size:15px}
.grow .gt small{display:block;color:var(--mist);font-size:12px;line-height:1.35}
.grow .val{min-width:62px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.mini-step{display:flex;align-items:center;gap:2px;background:var(--card-2);border-radius:12px;padding:3px}
.mini-step button{width:36px;height:36px;border-radius:9px;font-size:18px}
.mini-step button:active{background:rgba(255,255,255,.1)}
.switch{width:50px;height:30px;border-radius:99px;background:var(--card-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mist);transition:.2s}
.switch.on{background:var(--pine)}.switch.on::after{left:23px;background:#fff}
.summary{display:flex;flex-wrap:wrap;gap:6px}
.summary span{padding:7px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-top:10px}
.pills button{flex:none;min-height:36px;padding:0 12px;border-radius:99px;background:var(--card-2);font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:16px;min-height:96px;
  background:var(--card);border:1.5px solid var(--line);text-align:left}
.tile .ti{font-size:24px}
.tile b{font-size:14px;font-weight:600;line-height:1.2}
.tile small{font-size:11.5px;color:var(--mist);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tk{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.tile.on{border-color:var(--lantern);background:rgba(232,168,74,.09)}
.tile.on .tk{background:var(--lantern);border-color:var(--lantern);color:#24170a}
.tile.wolfteam.on{border-color:var(--blood);background:rgba(200,65,75,.09)}
.tile.wolfteam.on .tk{background:var(--blood);border-color:var(--blood);color:#fff}
.startbar{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,var(--sky) 28%)}
.startbar .in{max-width:488px;margin:0 auto}
.startbar .st{font-size:13px;text-align:center;margin-bottom:8px;color:#9fd8cf}
.startbar .st.bad{color:#f0a3a8}
/* ---- màn hình chính của quản trò + menu cài đặt + vòng cài đặt ---- */
.hm-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.gear{width:48px;height:48px;border-radius:16px;background:var(--card-2);border:1px solid var(--line);font-size:22px;flex:none}
.hm-top b{display:block;font:700 20px/1.2 var(--serif)}
.hm-top small{color:var(--mist);font-size:12px}
.hm-qr{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.hm-qr .big-qr{width:min(62vw,240px);aspect-ratio:1;border-radius:18px;background:#f4efe2;padding:10px;display:grid;place-items:center}
.hm-qr .big-qr svg{width:100%;height:100%}.hm-qr .big-qr svg path{fill:#14101f}
.hm-qr .code{font:700 38px/1 var(--serif);letter-spacing:.16em}
.hm-qr .hl-actions{width:100%}
.hm-hint{text-align:center;color:var(--faint);font-size:12px;margin-top:16px}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(5,6,12,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{position:fixed;top:0;bottom:0;left:0;z-index:21;width:min(86vw,360px);padding:calc(16px + env(safe-area-inset-top,0px)) 14px 20px;
  background:var(--sky-2);border-right:1px solid var(--line);overflow:auto;animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
.sheet h3{font:700 20px/1.2 var(--serif);margin:4px 4px 14px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{width:40px;height:40px;border-radius:12px;background:var(--card-2);font-size:18px}
.mitem{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 12px;border-radius:14px;text-align:left}
.mitem:active{background:var(--card-2)}
.mitem .mi{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:20px;flex:none}
.mitem b{display:block;font-weight:600}
.mitem small{display:block;color:var(--mist);font-size:12px}
.mitem .chev{margin-left:auto;color:var(--faint);font-size:20px}
.mitem .warn-dot{width:8px;height:8px;border-radius:50%;background:var(--blood);margin-left:6px;display:inline-block}
.pn-top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:8px 0 12px;background:var(--sky)}
.pn-top button{min-height:44px;padding:0 14px;border-radius:12px;background:var(--card-2);font-weight:600}
.pn-top b{font:700 19px/1.2 var(--serif)}
.hold-ring{position:fixed;z-index:30;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--lantern) 0deg,transparent 0deg);animation:holdfill 2s linear forwards;
  -webkit-mask:radial-gradient(circle,transparent 25px,#000 26px);mask:radial-gradient(circle,transparent 25px,#000 26px)}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes holdfill{from{--a:0deg}to{--a:360deg}}
.hold-ring{background:conic-gradient(var(--lantern) var(--a),rgba(255,255,255,.12) var(--a))}
#radial{position:fixed;inset:0;z-index:40;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:rgba(5,6,12,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);touch-action:none}
#radial .ring{position:absolute;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;
  background:radial-gradient(circle,var(--sky-2) 0 58px,rgba(255,255,255,.06) 59px 100%);border:1px solid var(--line)}
#radial .rc-center{position:absolute;width:116px;margin-left:-58px;text-align:center;font-size:13px;color:var(--bone);transform:translateY(-50%);pointer-events:none}
#radial .ri{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--card-2);border:1.5px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;transition:transform .12s,background .12s;color:var(--bone)}
#radial .ri small{font-size:9.5px;line-height:1.1;margin-top:2px;max-width:60px;text-align:center}
#radial .ri.hot{transform:scale(1.18);background:var(--lantern);color:#24170a;border-color:var(--lantern)}
.lobby-host{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lobby-host input,.lobby-host textarea{-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0));max-width:488px;margin:0 auto;
  padding:14px 16px;border-radius:14px;background:#3a1b1f;color:#f6d0d3;z-index:20;display:none}
.toast.show{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body class="night">
<main id="app"></main>
<div class="toast" id="toast" role="alert"></div>

<script>
const ROLE = {
  villager:{name:'Dân Làng',icon:'🧑‍🌾',desc:'Không có kỹ năng. Thảo luận và bỏ phiếu để tìm Ma Sói.'},
  bodyguard:{name:'Bảo Vệ',icon:'🛡️',desc:'Mỗi đêm bảo vệ 1 người khỏi bị sói cắn. Không bảo vệ 1 người 2 đêm liền.'},
  seer:{name:'Tiên Tri',icon:'🔮',desc:'Mỗi đêm soi 1 người: thuộc phe Dân Làng hay phe Sói.'},
  witch:{name:'Phù Thủy',icon:'🧪',desc:'1 bình cứu, 1 bình độc. Cứu người đã được bảo vệ hoặc độc người đằng nào cũng chết thì được hoàn bình.'},
  hunter:{name:'Thợ Săn',icon:'🏹',desc:'Chết trong đêm thì được kéo 1 người chết theo.'},
  diseased:{name:'Người Bệnh',icon:'🤒',desc:'Bị sói cắn chết thì đêm sau cả bầy không cắn được ai.'},
  moon_maiden:{name:'Nguyệt Nữ',icon:'🌙',desc:'Mỗi đêm chọn: soi vai 1 người, hoặc che chắn 1 người khỏi răng nanh và phong ấn của sói.'},
  spellcaster:{name:'Kẻ Phù Phép',icon:'🤐',desc:'Mỗi đêm khiến 1 người bị câm trong buổi thảo luận hôm sau.'},
  werewolf:{name:'Ma Sói',icon:'🐺',desc:'Mỗi đêm cùng bầy thống nhất cắn 1 người.'},
  mutant_wolf:{name:'Sói Biến Chủng',icon:'🌀',desc:'Đêm đầu là Dân Làng, từ đêm thứ 2 hoá sói và gia nhập bầy.'},
  wolf_cub:{name:'Sói Con',icon:'🐾',desc:'Nếu Sói Con chết, đêm sau bầy được cắn 2 người.'},
  snow_wolf:{name:'Sói Băng',icon:'❄️',desc:'Thuộc bầy sói. Mỗi đêm phong ấn năng lực của 1 người.'},
  cursed:{name:'Kẻ Bị Nguyền',icon:'🌗',desc:'Phe Dân. Bị sói cắn thì không chết mà hoá thành sói.'},
  traitor:{name:'Kẻ Phản Bội',icon:'🗡️',desc:'Tiên Tri soi ra Dân nhưng thắng cùng Sói. Sói chết hết thì hoá Ma Sói cuối cùng.'},
  cloner:{name:'Kẻ Nhân Bản',icon:'🧬',desc:'Đêm đầu chọn 1 người. Người đó chết thì nhận vai và phe của họ.'},
  creator:{name:'Kẻ Sáng Tạo',icon:'✨',desc:'Thêm 2 lá dư khi chia bài. Xem 2 lá đó và chọn 1 làm vai của mình.'},
};
/* Thông tin vai: vai có sẵn hoặc vai tự tạo (S.role_defs) */
const RI = k => ROLE[k] || (S?.role_defs?.[k] ? {...S.role_defs[k], team: S.role_defs[k].team === 'wolves' ? 'wolf' : 'village'}
                                               : (k ? {name: k, icon: '❔', desc: ''} : undefined));
const phaseLabel = ph => ph === 'night_custom' && S?.custom_step ? `${S.custom_step.name} thức dậy` : (PHASE[ph] || ph);
const GROUPS = [
  {title:'Phe Ma Sói', keys:['werewolf','mutant_wolf','wolf_cub','snow_wolf']},
  {title:'Phe Dân Làng', keys:['bodyguard','seer','witch','hunter','diseased','moon_maiden','spellcaster','villager']},
  {title:'Phe thứ ba & biến đổi', keys:['cursed','traitor','cloner','creator']},
];
const WOLF_CARDS = ['werewolf','mutant_wolf','wolf_cub','snow_wolf'];
const PHASE = {
  lobby:'Phòng chờ', nightfall:'Màn đêm buông xuống', night_creator:'Kẻ Sáng Tạo thức dậy', night_cloner:'Kẻ Nhân Bản thức dậy',
  night_moon:'Nguyệt Nữ thức dậy', night_snow:'Sói Băng thức dậy', night_guard:'Bảo Vệ thức dậy',
  night_wolves:'Bầy sói thức dậy', night_seer:'Tiên Tri thức dậy', night_witch:'Phù Thủy thức dậy',
  night_spell:'Kẻ Phù Phép thức dậy', dawn:'Bình minh', day_discuss:'Thảo luận',
  day_vote:'Bỏ phiếu treo cổ', verdict:'Phán quyết', hunter_shot:'Phát súng cuối', ended:'Kết thúc',
};
const KIND = {
  cloner:{t:'🧬 Chọn người để nhân bản', d:'Khi người này chết, bạn nhận vai và phe của họ.', btn:'Nhân bản'},
  moon:{t:'🌙 Nguyệt Nữ', d:'Chọn một người, rồi quyết định soi vai hay che chắn họ khỏi sói đêm nay.', rt:'🌙 Ánh trăng tiết lộ'},
  snow:{t:'❄️ Phong ấn ai đêm nay?', d:'Người đó mất năng lực trong đêm nay.', btn:'Phong ấn', danger:1},
  guard:{t:'🛡️ Bảo vệ ai đêm nay?', btn:'Bảo vệ'},
  wolf_vote:{t:'🐺 Chọn con mồi', btn:'Cắn', danger:1},
  seer:{t:'🔮 Soi ai đêm nay?', d:'Bạn sẽ biết người đó thuộc phe Dân Làng hay phe Sói.', btn:'Soi', rt:'🔮 Lời tiên tri'},
  spell:{t:'🤐 Phù phép ai?', d:'Người đó sẽ không được nói trong buổi thảo luận ngày mai.', btn:'Phù phép'},
  vote:{t:'⚖️ Treo cổ ai?', btn:'Bỏ phiếu cho'},
  hunter:{t:'🏹 Phát súng cuối', d:'Bạn đã chết trong đêm. Chọn một người để kéo theo.', btn:'Bắn', danger:1},
  frozen:{t:'❄️ Bạn bị phong ấn'},
  wolf_sick:{t:'🤒 Bầy sói nhiễm bệnh'},
};

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => n.startsWith('🤖') ? '🤖'
  : n.trim().split(/\s+/).slice(-2).map(w => [...w][0] || '').join('').toUpperCase();

let invite = null, qrFull = false, pendingBots = false;
let S = null, ws = null, clockOffset = 0, picks = [], stepKey = '', revealing = false, wakeLock = null;
let session = load('masoi_session');

function load(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function save(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const P = id => S.players.find(p => p.id === id) || {name:'?'};

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200);
}
function send(obj){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); else toast('Mất kết nối, đang thử lại…'); }
const act = (action, target = null) => send({type:'action', action, target});

async function api(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'Không kết nối được máy chủ');
  return d;
}

/* ---------------- kết nối ---------------- */
function connect(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const q = new URLSearchParams({pid:session.player_id, token:session.token});
  firstState = true;
  ws = new WebSocket(`${proto}://${location.host}/ws/${session.code}?${q}`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'state'){ S = m; clockOffset = m.server_now * 1000 - Date.now(); onState(); }
    else if (m.type === 'error') toast(m.message);
  };
  ws.onclose = e => {
    if (e.code === 4401 || e.code === 4403){ save('masoi_session', null); session = null; S = null;
      if (e.code === 4403) toast('Bạn đã bị mời ra khỏi phòng'); render(); return; }
    if (e.code === 4409 || !session) return;           // đã mở ở tab khác / tự rời
    setTimeout(() => session && connect(), 1500);       // mất mạng: tự nối lại
  };
}

function stopSpeech(){
  speakQueue = []; speaking = false; currentLine = '';
  tts?.cancel();
}

let prevPhase = null;
function onState(){
  // Chơi ván mới / về phòng chờ: dừng ngay phần đọc diễn biến ván cũ
  if ((prevPhase === 'ended' && S.phase !== 'ended') || (prevPhase && prevPhase !== 'lobby' && S.phase === 'lobby')) stopSpeech();
  if (S.phase !== 'lobby'){ hostPanel = null; menuOpen = false; closeRadial?.(); }
  prevPhase = S.phase;
  if (S.me.narrator || (S.me.is_host && S.settings.host_voice)) queueSpeech(S.speech);
  if (pendingBots && S.phase === 'lobby' && S.me.is_host){
    pendingBots = false;
    send({type:'bots', op:'fill', n: Math.max(8, S.players.length + (load('masoi_last_config')?.bots || 0))});
    send({type:'settings', settings:{host_voice:true}});
  }
  if (S.me.narrator && S.me.is_host && !scriptsSynced){
    scriptsSynced = true;
    const local = load('masoi_scripts');
    if (local && Object.keys(local).length && !Object.keys(S.settings.scripts || {}).length)
      send({type:'settings', settings:{scripts: local}});
  }
  syncHostConfig();
  if (document.activeElement?.dataset?.script || document.activeElement?.closest?.('#roleForm')){ pendingRender = true; return; }  // đang gõ: chưa vẽ lại
  const key = `${S.phase}-${S.day}`;
  if (key !== stepKey){ stepKey = key; picks = []; if (S.action) navigator.vibrate?.([120,60,120]); }
  if (S.phase !== 'lobby' || S.me.narrator) keepAwake();
  render();
}

async function keepAwake(){
  if (wakeLock || !('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.onrelease = () => wakeLock = null; } catch {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && S.phase !== 'lobby') keepAwake(); });

/* ---------------- lời quản trò có thể chỉnh ---------------- */
const SCRIPT_GROUPS = [
  ['Màn đêm', [['nightfall', 'Bắt đầu mỗi đêm', ['dem']], ['sleep', 'Cho vai đi ngủ (dùng chung mọi vai)', ['vai']]]],
  ['Gọi vai thức dậy', [['call_creator', 'Kẻ Sáng Tạo'], ['call_cloner', 'Kẻ Nhân Bản'], ['call_bodyguard', 'Bảo Vệ'],
    ['call_werewolf', 'Ma Sói'], ['call_witch', 'Phù Thủy'], ['call_seer', 'Tiên Tri'], ['call_moon_maiden', 'Nguyệt Nữ'],
    ['call_snow_wolf', 'Sói Băng'], ['call_spellcaster', 'Kẻ Phù Phép']]],
  ['Trời sáng', [['dawn_deaths', 'Có người chết', ['nguoi_chet']], ['dawn_peace', 'Không ai chết'],
    ['reveal', 'Lật vai người chết', ['ten', 'vai']], ['silenced', 'Người bị phù phép', ['ten']],
    ['hunter_call', 'Gọi Thợ Săn', ['ten']], ['hunter_shot', 'Thợ Săn bắn', ['ten']], ['hunter_skip', 'Thợ Săn không bắn']]],
  ['Ban ngày', [['discuss', 'Bắt đầu thảo luận', ['thoi_gian']], ['ready', 'Đa số bấm Vote ngay'],
    ['host_skip', 'Quản trò cho bỏ phiếu ngay'], ['vote', 'Bắt đầu bỏ phiếu'],
    ['lynch', 'Có người bị treo cổ', ['ten', 'so_phieu']], ['no_lynch', 'Không ai bị treo cổ'],
    ['vote_detail', 'Công khai phiếu (khi bật hiển thị ai vote ai)', ['ten', 'so_phieu', 'nguoi_bo_phieu']]]],
  ['Kết thúc', [['end', 'Công bố phe thắng', ['phe_thang']], ['ranking', 'Đọc bảng xếp hạng (3 người đầu)', ['so_van', 'xep_hang']],
    ['thanks', 'Lời chào cuối'], ['cancel', 'Huỷ ván']]],
];
const PH_LABEL = {dem:'số đêm', vai:'tên vai', nguoi_chet:'tên người chết', ten:'tên người', so_phieu:'số phiếu',
  thoi_gian:'thời gian', phe_thang:'phe thắng', nguoi_bo_phieu:'người bỏ phiếu',
  so_van:'số ván', xep_hang:'danh sách xếp hạng'};
const SAMPLE = {dem:1, vai:'Bảo Vệ', nguoi_chet:'An và Bình', ten:'An', so_phieu:5, thoi_gian:'3 phút', phe_thang:'Phe Dân Làng', nguoi_bo_phieu:'Bình, Chi và Dũng', so_van:3,
  xep_hang:'hạng 1 là An với 3 điểm, hạng 2 là Bình với 2 điểm, hạng 3 là Chi với 1 điểm'};
let editorOpen = false, pendingRender = false, scriptsSynced = false, saveTimer = null;
const fillSample = t => t.replace(/\{(\w+)\}/g, (m, k) => k in SAMPLE ? SAMPLE[k] : m);
const scriptText = key => S.settings.scripts?.[key] || S.script_defaults?.[key] || '';

function scriptEditor(){
  if (!S.script_defaults) return '';
  const nCustom = Object.keys(S.settings.scripts || {}).length;
  const line = ([key, label, phs = []]) => {
    const text = scriptText(key), custom = !!S.settings.scripts?.[key];
    const unknown = [...text.matchAll(/\{(\w+)\}/g)].map(m => m[1]).filter(k => !phs.includes(k));
    return `<div class="sline ${custom ? 'custom' : ''}"><label><b>${label}</b>${custom ? ' · đã sửa' : ''}</label>
      <textarea data-script="${key}" rows="3" maxlength="300">${esc(text)}</textarea>
      ${unknown.length ? `<div class="bad">Chỗ trống không dùng được ở câu này: ${unknown.map(k => `{${esc(k)}}`).join(', ')}</div>` : ''}
      <div class="tools">${phs.map(p => `<button class="ph" data-ph="${p}" data-for="${key}">+ {${p}} ${PH_LABEL[p]}</button>`).join('')}
        <button data-preview="${key}">🔊 Nghe</button>${custom ? `<button data-reset="${key}">↺ Mặc định</button>` : ''}</div></div>`;
  };
  return `<details class="scripts" id="scriptEditor" ${editorOpen ? 'open' : ''}>
    <summary>✏️ Chỉnh lời quản trò${nCustom ? ` (${nCustom} câu đã sửa)` : ''}</summary>
    <p class="muted" style="font-size:14px">Sửa chữ rồi chạm ra ngoài là lưu, có hiệu lực ngay cả khi đang chơi. Chữ trong ngoặc nhọn như {ten} là chỗ máy tự điền. Lời bạn sửa được nhớ trên máy này cho các phòng sau.</p>
    ${SCRIPT_GROUPS.map(([title, lines]) => `<h4>${title}</h4>${lines.map(line).join('')}`).join('')}
    ${nCustom ? '<div style="margin-top:14px"><button class="btn" data-do="reset_all_scripts">↺ Trả tất cả về lời mặc định</button></div>' : ''}
  </details>`;
}
function saveScript(key, text){
  const local = load('masoi_scripts') || {};
  if (text.trim() && text.trim() !== S.script_defaults[key]) local[key] = text.trim(); else delete local[key];
  save('masoi_scripts', local);
  send({type:'settings', settings:{scripts:{[key]: text}}});
}
function previewSpeak(text){
  if (!tts){ toast(text); return; }
  audioReady = true; tts.cancel(); speaking = false;
  speakQueue.unshift(text); pump();
}

/* ---------------- giọng quản trò (Web Speech API) ---------------- */
let voices = [], voiceName = load('masoi_voice'), rate = load('masoi_rate') || 1, muted = false;
let audioReady = false, firstState = true, lastSpoken = 0, currentLine = '', speakQueue = [], speaking = false;
const tts = window.speechSynthesis;
function loadVoices(){
  if (!tts) return;
  voices = tts.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('vi'));
  if (S?.me?.narrator && S.phase === 'lobby') render();
}
if (tts){ loadVoices(); tts.onvoiceschanged = loadVoices; setInterval(() => { if (tts.speaking) tts.resume(); }, 4000); }

function queueSpeech(list){
  if (firstState){  // vừa (nối lại) kết nối: không đọc lại các câu cũ
    firstState = false;
    if (S.phase !== 'lobby' && list.length) lastSpoken = Math.max(lastSpoken, list[list.length - 1].id);
    return;
  }
  for (const line of list) if (line.id > lastSpoken){ lastSpoken = line.id; speakQueue.push(line.text); }
  pump();
}
function pump(){
  if (speaking || !speakQueue.length) return;
  const text = speakQueue.shift();
  currentLine = text;
  const sub = $('#subtitle'); if (sub) sub.textContent = text;
  if (muted || !tts || !audioReady){ setTimeout(pump, 300); return; }
  // không đọc biểu tượng (🤖, 🐺…) – chỉ đọc chữ
  const spoken = text.replace(/[\p{Extended_Pictographic}\u{1F3FB}-\u{1F3FF}\uFE0F\u200D]/gu, '').replace(/\(\s*/g, '(').replace(/\s+/g, ' ').trim();
  if (!spoken){ setTimeout(pump, 50); return; }
  speaking = true;
  const u = new SpeechSynthesisUtterance(spoken);
  u.lang = 'vi-VN'; u.rate = rate;
  const v = voices.find(x => x.name === voiceName) || voices[0]; if (v) u.voice = v;
  let doneCalled = false;
  const done = () => { if (doneCalled) return; doneCalled = true; speaking = false; pump(); };
  u.onend = done; u.onerror = done;
  setTimeout(done, 2500 + text.length * 120 / rate);  // phòng khi trình duyệt không báo onend
  tts.speak(u);
}
function unlockAudio(){
  if (!tts){ toast('Trình duyệt này không hỗ trợ đọc giọng nói'); return; }
  audioReady = true;
  tts.cancel(); speaking = false;
  speakQueue.unshift('Xin chào, tôi là quản trò. Chúc mọi người chơi vui vẻ.');
  pump();
}

function syncHostConfig(){
  if (!S.me.is_host || S.phase !== 'lobby') return;
  const bots = S.players.filter(p => p.bot).length;
  if (configSynced !== S.code){   // phòng mới: áp dụng cấu hình đã lưu đúng một lần
    configSynced = S.code;
    const lib = crLib(), cfg = load('masoi_last_config');
    const settings = {};
    const missing = Object.fromEntries(Object.entries(lib).filter(([k]) => !(k in (S.settings.custom_roles || {}))));
    if (Object.keys(missing).length) settings.custom_roles = missing;
    if (cfg && !S.games_played){
      CONFIG_KEYS.forEach(k => { if (k in cfg && !(S.me.narrator && k === 'host_voice')) settings[k] = cfg[k]; });
      if (cfg.roles_custom && cfg.roles) settings.roles = cfg.roles;
    }
    if (Object.keys(settings).length) send({type:'settings', settings});
    if (cfg?.bots && !bots && !pendingBots) send({type:'bots', op:'fill', n: S.players.length + cfg.bots});
    if (cfg && !S.games_played) toast('✓ Đã dùng lại cấu hình lần trước');
    return;
  }
  const cfg = {roles: S.settings.roles, roles_custom: S.roles_custom, bots};
  CONFIG_KEYS.forEach(k => cfg[k] = S.settings[k]);
  save('masoi_last_config', cfg);
}

function roleProblem(){
  const n = S.players.length, r = S.settings.roles;
  const creator = (r.creator || 0) > 0, need = n + (creator ? S.limits.creator_extra : 0);
  const total = Object.values(r).reduce((x, y) => x + y, 0), specials = total - (r.villager || 0);
  const wolves = WOLF_CARDS.reduce((x, k) => x + (r[k] || 0), 0)
    + Object.entries(S.settings.custom_roles || {}).reduce((x, [k, d]) => x + (d.team === 'wolves' ? (r[k] || 0) : 0), 0);
  let problem = '';
  if (n < S.limits.min) problem = `Cần thêm ${S.limits.min - n} người nữa`;
  else if (specials > need) problem = `Thừa ${specials - need} vai đặc biệt – hãy bớt vai`;
  else if (wolves < 1) problem = 'Cần ít nhất 1 lá phe Sói';
  else if (wolves >= n - wolves) problem = 'Sói đang ngang hoặc đông hơn Dân';
  return {problem, n, specials, wolves, village: n - wolves, creator, villagers: r.villager || 0};
}

/* ---------------- vòng cài đặt: giữ 2 giây rồi vuốt ---------------- */
let hold = null, radial = null;
function openPanel(k){ hostPanel = k; menuOpen = false; render(); window.scrollTo({top: 0}); }
function cancelHold(){ if (hold){ clearTimeout(hold.timer); hold.ring.remove(); hold = null; } }
function openRadial(x, y){
  cancelHold();
  navigator.vibrate?.(30);
  const R = 118, cx = Math.min(Math.max(x, 155), innerWidth - 155), cy = Math.min(Math.max(y, 170), innerHeight - 170);
  radial = {cx, cy, hot: null, dragging: true};
  const el = document.createElement('div'); el.id = 'radial';
  el.innerHTML = `<div class="ring" style="left:${cx}px;top:${cy}px"></div>
    <div class="rc-center" id="rcLabel" style="left:${cx}px;top:${cy}px">Vuốt tới mục cần chỉnh</div>
    ${PANELS.map(([k, i, t], n) => {
      const ang = (n / PANELS.length) * 2 * Math.PI - Math.PI / 2;
      return `<button class="ri" data-panel="${k}" style="left:${cx + R * Math.cos(ang)}px;top:${cy + R * Math.sin(ang)}px">${i}<small>${t}</small></button>`;
    }).join('')}`;
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-panel]');
    if (b){ closeRadial(); openPanel(b.dataset.panel); } else if (!radial?.dragging) closeRadial();
  });
  document.body.appendChild(el);
}
function radialMove(x, y){
  const dx = x - radial.cx, dy = y - radial.cy, items = document.querySelectorAll('#radial .ri');
  let hot = null;
  if (Math.hypot(dx, dy) > 50){
    const deg = (Math.atan2(dy, dx) * 180 / Math.PI + 90 + 360) % 360;
    hot = Math.round(deg / (360 / PANELS.length)) % PANELS.length;
  }
  if (hot === radial.hot) return;
  radial.hot = hot;
  items.forEach((b, n) => b.classList.toggle('hot', n === hot));
  $('#rcLabel').textContent = hot === null ? 'Vuốt tới mục cần chỉnh' : PANELS[hot][2];
  if (hot !== null) navigator.vibrate?.(8);
}
function closeRadial(){ document.getElementById('radial')?.remove(); radial = null; }
app.addEventListener('pointerdown', e => {
  if (!S || S.phase !== 'lobby' || !S.me.is_host || hostPanel || menuOpen || radial) return;
  if (e.target.closest('button, input, textarea, select, a, .qr-full, .startbar')) return;
  cancelHold();
  const ring = document.createElement('div');
  ring.className = 'hold-ring'; ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px';
  document.body.appendChild(ring);
  hold = {x: e.clientX, y: e.clientY, ring, timer: setTimeout(() => openRadial(e.clientX, e.clientY), 2000)};
});
document.addEventListener('pointermove', e => {
  if (hold && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 12) cancelHold();
  if (radial?.dragging) radialMove(e.clientX, e.clientY);
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => {
  cancelHold();
  if (radial?.dragging){
    radial.dragging = false;
    if (radial.hot !== null){ const k = PANELS[radial.hot][0]; closeRadial(); openPanel(k); }
  }
}));
document.addEventListener('touchmove', e => { if (radial) e.preventDefault(); }, {passive: false});
document.addEventListener('contextmenu', e => { if (hold || radial) e.preventDefault(); });

function renderGame(){
  const ph = S.phase, night = ph.startsWith('night') || ph === 'setup_creator';

  app.innerHTML = `

    ${!S.me.alive && !a ? `<div class="dead-banner">💀 Bạn đã chết. Hãy giữ im lặng, không ra hiệu cho ai.</div>` : ''}
    ${S.me.alive && S.silenced === S.me.id && !night ? `<div class="dead-banner">🤐 Bạn bị phù phép – không được nói trong buổi thảo luận hôm nay. Vẫn được bỏ phiếu.</div>` : ''}
    ${S.me.is_host && S.settings.host_voice && !audioReady ? `<button class="btn primary" data-do="unlock" style="margin-bottom:14px">🔊 Chạm để bật giọng quản trò</button>` : ''}
    ${a ? renderAction(a) : renderPassive()}

      ${S.private.slice(1).reverse().map(t => `<p>${esc(t)}</p>`).join('') || '<p class="muted">Chưa có.</p>'}
      <p class="muted" style="font-size:13px;margin-top:14px">Trong làng: ai chết, ai bị treo cổ, ai bị câm</p>
      ${S.log.slice().reverse().map(l => `<p>${esc(l.text)}</p>`).join('') || '<p class="muted">Chưa có.</p>'}</details>
    ${S.me.is_host ? `<div style="margin-top:18px">${voteToggle()}<button class="btn" data-do="cancel_game" style="margin-top:10px">⛔ Huỷ ván (chủ phòng)</button></div>` : ''}

function renderPassive(){

  if (ph === 'setup_creator') return `
    <div class="stage"><div class="big">🃏</div><h2>Đang chia bài</h2><p>Kẻ Sáng Tạo đang chọn vai. Chờ một chút nhé.</p></div>`;

    <div class="stage"><div class="big">🌙</div><h2>Hãy nhắm mắt</h2>
      <p>${phaseLabel(ph)}. Đặt điện thoại úp xuống, đừng nhìn người khác.</p></div>`;
  if (ph === 'dawn' || ph === 'verdict') {
    const recent = S.log.slice(-4).filter(l => !l.text.startsWith('🌙')).map(l => esc(l.text)).join('<br>');

  if (ph === 'day_discuss') return `
    <div class="stage" style="padding-top:4vh"><div class="big">☀️</div><h2>Cả làng thảo luận</h2>
      <p>Ai đáng ngờ? Nói ra lập luận của bạn trước khi bỏ phiếu.</p></div>
    ${S.me.alive ? `<div style="margin-bottom:16px"><button class="btn ${S.ready.me ? '' : 'primary'}" data-ack="ready_vote">
      ${S.ready.me ? '✓ Bạn đã sẵn sàng (bấm để huỷ)' : '🗳️ Vote ngay'}</button>
      <p class="muted" style="text-align:center;margin-top:8px;font-size:14px">${S.ready.count}/${S.ready.need} người cần để bỏ phiếu ngay</p></div>` : ''}
    ${chatter()}
    ${board()}
    ${S.me.is_host ? `<div style="margin-top:18px"><button class="btn" data-do="skipdisc">Chủ phòng: bỏ phiếu ngay</button></div>` : ''}`;
  if (ph === 'day_vote') return `<div class="panel"><h2>Đang bỏ phiếu</h2><p>Kết quả hiện ngay khi có phiếu.</p></div>${tally()}`;

function chatter(){
  const lines = (S.chat || []).slice(-5);
  return lines.length ? `<div class="potion" style="margin-bottom:16px"><h3>Máy chơi đang nói</h3>
    ${lines.map(l => `<p style="margin:6px 0;color:var(--bone)">${esc(l.text.replace('💬 ', ''))}</p>`).join('')}</div>` : '';
}

function board(){
  return `<div class="grid">${S.players.map(p => `<div class="pcard ${p.alive ? '' : 'dead'}">
    <span class="av">${esc(initials(p.name))}</span><span class="pn">${esc(p.name.replace('🤖 ', ''))}${p.id === S.silenced ? ' 🤐' : ''}</span>
    ${p.role && !p.alive ? `<span class="who">${RI(p.role).name}</span>` : ''}</div>`).join('')}</div>`;
}

function voteCounts(){
  const c = {};
  Object.values(S.votes).forEach(t => c[t] = (c[t] || 0) + 1);
  return c;
}

function voteToggle(){
  if (!S.me.is_host) return '';
  return `<button class="toggle ${S.settings.show_votes ? 'on' : ''}" data-do="show_votes">
    <span>Công khai ai bỏ phiếu cho ai${S.settings.show_votes ? '' : ' (đang phiếu kín)'}</span><i></i></button>`;
}
const votersOf = id => Object.entries(S.votes).filter(([v, t]) => t === id && !v.startsWith('#')).map(([v]) => P(v).name.replace('🤖 ', ''));

function tally(){
  const rows = Object.entries(voteCounts()).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '';
  return `<div class="tally">${rows.map(([t, n]) => `<div><span>${t === 'skip' ? 'Phiếu trắng' : esc(P(t).name)}
    ${S.settings.show_votes ? `<small style="display:block">${esc(votersOf(t).join(', '))}</small>` : ''}</span><b>${n}</b></div>`).join('')}</div>`;
}

function grid(ids, chosen = [], extra){
  const sel = picks.length ? picks : chosen;
  return `<div class="grid">${ids.map(id => `<button class="pcard ${sel.includes(id) ? 'sel' : ''}" data-pick="${id}">
    <span class="av">${esc(initials(P(id).name))}</span><span class="pn">${esc(P(id).name.replace('🤖 ', ''))}</span>${extra ? extra(id) : ''}</button>`).join('')}</div>`;
}

function confirmBar(a, K){
  if (!picks.length || picks.length !== (a.pick || 1)) return '';
  const cur = [].concat(a.chosen || []).filter(x => x && x !== 'skip').sort().join();
  if (cur && cur === [...picks].sort().join()) return '';
  document.body.classList.add('has-confirm');
  const names = esc(picks.map(id => P(id).name).join(' và '));
  if (a.kind === 'moon') return `<div class="confirm"><div class="row">
    <button class="btn" data-do="confirm" data-act="moon_check">🔍 Soi vai</button>
    <button class="btn primary" data-do="confirm" data-act="moon_shield">🛡️ Che chắn</button></div></div>`;
  return `<div class="confirm"><button class="btn ${K.danger ? 'danger' : 'primary'}" data-do="confirm">${K.btn} ${names}</button></div>`;
}

function renderAction(a){
  const K = KIND[a.kind] || {t: a.title, d: a.desc, btn: a.verb, rt: a.title, danger: a.danger};
  if (a.info) return `<div class="panel"><h2>${K.t}</h2><div class="result">${esc(a.info)}</div>
    <button class="btn primary" data-ack="${a.ack}">Đã hiểu, nhắm mắt</button></div>`;
  if (a.result) return `<div class="panel"><h2>${K.rt}</h2><div class="result">${esc(a.result)}</div>
    <button class="btn primary" data-ack="${a.ack}">Đã ghi nhớ, nhắm mắt</button></div>`;
  if (a.kind === 'creator') return `<div class="panel"><h2>✨ Kẻ Sáng Tạo</h2>
    <p>Hai lá bài dư ra. Chọn một lá làm vai của bạn trong ván này.</p>
    <div class="choices">${a.options.map(k => `<button class="rcard" data-ack="creator_pick" data-target="${k}">
      <span class="ricon">${RI(k).icon}</span><div class="rinfo"><b>${RI(k).name}</b><small>${RI(k).desc}</small></div></button>`).join('')}</div></div>`;
  if (a.kind === 'witch') return renderWitch(a);

  let desc = K.d || '', extra = null, bottom = '';
  const chosen = [].concat(a.chosen || []).filter(x => x !== 'skip');
  if (a.kind === 'guard') desc = a.last ? `Đêm qua bạn đã bảo vệ ${esc(P(a.last).name)}, đêm nay phải chọn người khác.` : 'Có thể chọn cả chính bạn.';
  if (a.kind === 'wolf_vote') {
    desc = a.pick > 1 ? 'Sói Con đã chết – đêm nay bầy được cắn 2 người. Cả bầy cần chọn giống nhau.'
                      : 'Cả bầy chọn cùng một người là xong lượt ngay. Hết giờ sẽ theo số đông.';
    const by = id => Object.entries(a.team_votes).filter(([, ts]) => ts.includes(id)).map(([w]) => P(w).name);
    extra = id => by(id).length ? `<span class="badge">${by(id).length}</span><span class="who">${esc(by(id).join(', '))}</span>` : '';
  }
  if (a.kind === 'vote') {
    const c = voteCounts();
    desc = a.chosen ? `Bạn đang chọn ${a.chosen === 'skip' ? 'phiếu trắng' : esc(P(a.chosen).name)}. Có thể đổi trước khi hết giờ.` : 'Chọn người bạn nghi là sói.';
    extra = id => (c[id] ? `<span class="badge">${c[id]}</span>` : '')
      + (S.settings.show_votes && votersOf(id).length ? `<span class="who">${esc(votersOf(id).join(', '))}</span>` : '');
    bottom = `<div style="margin-top:14px"><button class="btn" data-do="vote_skip">Bỏ phiếu trắng${c.skip ? ` (${c.skip})` : ''}</button></div>
      <p class="muted" style="font-size:13px;text-align:center;margin-top:8px">${S.settings.show_votes ? 'Phiếu công khai: mọi người thấy ai bầu ai.' : 'Phiếu kín: chỉ hiện số phiếu.'}</p>`;
  }
  if (a.kind === 'hunter') bottom = `<div style="margin-top:14px"><button class="btn" data-ack="hunter_skip">Không bắn</button></div>`;
  return `<div class="panel"><h2>${K.t}</h2><p>${desc}</p>${grid(a.targets, chosen, extra)}${bottom}${confirmBar(a, K)}</div>`;
}

function renderWitch(a){
  const v = a.victims || [];
  const heal = a.healed ? `<p>Bạn đã cứu ${esc(P(a.healed).name)} ✓</p>`
    : !a.heal_left ? '<p>Bạn không còn bình cứu.</p>'
    : v.length ? `<p>Đêm nay sói cắn: <b>${esc(v.map(x => P(x).name).join(', '))}</b>.</p>
        ${v.map(x => `<button class="btn primary" data-ack="witch_heal" data-target="${x}">Cứu ${esc(P(x).name)}</button>`).join('')}`
    : '<p>Đêm nay sói không cắn ai.</p>';
  const poison = a.poisoned ? `<p>Bạn đã đầu độc ${esc(P(a.poisoned).name)}.</p>`
    : a.poison_left ? `<p>Chạm vào một người để đầu độc.</p>${grid(a.targets)}` : '<p>Bạn không còn bình độc.</p>';
  return `<div class="panel"><h2>🧪 Phù Thủy</h2><p>Dùng bình nào cũng được, hoặc cất đi.</p>
    <div class="potion"><h3>Bình cứu</h3>${heal}</div>
    <div class="potion"><h3>Bình độc</h3>${poison}</div>
    ${picks.length ? confirmBar(a, {btn:'Đầu độc', danger:1}) : `<button class="btn" data-ack="witch_done">Xong, nhắm mắt</button>`}</div>`;
}

function teamOf(){
  const k = S.me.role;
  if (S.me.wolf) return ['Phe Ma Sói', 't-wolf'];
  if (k === 'traitor') return ['Thắng cùng phe Sói', 't-wolf'];
  if (k === 'mutant_wolf') return ['Đêm đầu là Dân – sắp hoá sói', 't-wolf'];
  if (k === 'cloner') return ['Chưa có phe', 't-third'];
  if (k === 'creator') return ['Đang chọn vai', 't-third'];
  if (S.role_defs?.[k]) return S.role_defs[k].team === 'wolves' ? ['Phe Ma Sói', 't-wolf'] : ['Phe Dân Làng', 't-village'];
  return ['Phe Dân Làng', 't-village'];
}

function renderReveal(){
  const R = RI(S.me.role); if (!R) return '';
  const [team, cls] = teamOf();
  return `<div class="reveal ${revealing ? 'show' : ''}" id="reveal">
    <div class="big">${R.icon}</div><h2>${R.name}</h2>
    <div class="team ${cls}">${team}</div>
    <p class="muted" style="max-width:30ch;margin-bottom:16px">${R.desc}</p>
    <ul>${S.private.slice(1).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
}

  document.body.className = 'day';
  const wolves = S.winner === 'wolves';
  app.innerHTML = `
    <div class="win"><div class="big">${wolves ? '🐺' : '🏡'}</div>
      <h2 class="${wolves ? 't-wolf' : 't-village'}">${wolves ? 'Phe Ma Sói thắng' : 'Phe Dân Làng thắng'}</h2>
      <p class="muted">Sau ${S.day} đêm</p></div>
    ${nextPanel()}
    ${resultHtml()}
    ${leaderboardHtml(true)}
    ${recapHtml()}
    ${S.me.narrator ? `<div class="narr-tools"><button class="btn" data-do="replay_recap">🔊 Đọc lại diễn biến</button>
      <button class="btn" data-do="mute">${muted ? '🔈 Bật tiếng' : '🔇 Tắt tiếng'}</button></div>` : ''}`;
}

const SCORE_RULES = 'Phe thắng: mỗi người +1 điểm, kể cả đã chết trong đêm. Bị dân làng treo cổ ban ngày: không được điểm ván đó.';

function resultHtml(){
  const rows = S.last_result || [];
  if (!rows.length) return '';
  const alive = rows.filter(r => r.alive).length;
  return `<div class="section"><h3>Người chơi, vai trò và điểm</h3><span class="meta">${alive} người sống sót</span></div>
    <p class="rules">${SCORE_RULES}</p>
    <table class="score"><tr><th></th><th>Người chơi</th><th>Điểm</th></tr>
    ${rows.map(r => `<tr class="${r.id === S.me.id ? 'me' : ''}">
      <td>${r.lynched ? '⚖️' : r.alive ? '🙂' : '💀'}</td>
      <td class="n">${esc(r.name)}${r.id === S.me.id ? ' (bạn)' : ''}<small>${RI(r.role)?.icon || ''} ${RI(r.role)?.name || ''} · ${r.team === 'wolves' ? 'phe Sói' : 'phe Dân'} · ${esc(r.reason)}</small></td>
      <td class="gain ${r.gain ? 'plus' : ''}">${r.gain ? '+' + r.gain : '0'}</td></tr>`).join('')}</table>`;
}

function leaderboardHtml(open){
  const rows = S.scores || [];
  if (!rows.length) return '';
  const medal = k => ['🥇', '🥈', '🥉'][k - 1] || k;
  const body = `<p class="rules">${SCORE_RULES}</p>
    <table class="score"><tr><th>#</th><th>Người chơi</th><th>Điểm</th><th>Ván</th><th>Thắng</th><th>Bị treo</th></tr>
    ${rows.map(r => `<tr class="${r.name === S.me.name ? 'me' : ''}"><td>${medal(r.rank)}</td><td class="n">${esc(r.name)}</td>
      <td><b>${r.points}</b></td><td>${r.games}</td><td>${r.wins}</td><td>${r.lynched}</td></tr>`).join('')}</table>
    ${S.me.is_host ? '<button class="btn" data-do="reset_scores" style="margin-top:12px">🗑️ Xoá bảng xếp hạng</button>' : ''}`;
  return `<details class="scripts" ${open ? 'open' : ''}><summary>🏆 Bảng xếp hạng sau ${S.games_played} ván</summary>${body}</details>`;
}

function nextPanel(){
  const r = S.next_ready || {count:0, total:0, me:false};
  const status = `<p class="muted" style="text-align:center;margin-top:8px;font-size:14px">✓ ${r.count}/${r.total} người thật sẵn sàng chơi tiếp</p>`;
  if (S.me.is_host) return `<div style="margin-top:8px">
      <button class="btn primary" data-do="new_game">▶ Bắt đầu ván mới</button>${status}
      <button class="btn" data-do="restart">⚙️ Về phòng chờ để đổi vai</button>
      ${S.me.narrator ? '' : '<button class="btn" data-do="leave">Rời phòng</button>'}</div>`;
  return `<div style="margin-top:8px">
      <button class="btn ${r.me ? '' : 'primary'}" data-do="ready_next">${r.me ? '✓ Đã sẵn sàng (bấm để huỷ)' : '✋ Sẵn sàng chơi tiếp'}</button>${status}
      <p class="muted" style="text-align:center;font-size:14px">Khi chủ phòng bấm bắt đầu, điện thoại của bạn tự vào ván mới.</p>
      <button class="btn" data-do="leave">Rời phòng</button></div>`;
}

function recapHtml(){
  if (!S.history?.length) return '';
  let period = null, out = '';
  for (const h of S.history){
    if (h.period !== period){ period = h.period; out += `<h4>${esc(period)}</h4>`; }
    out += `<p>${esc(h.text)}</p>`;
  }
  return `<div class="section"><h3>Diễn biến ván chơi</h3></div><div class="recap">${out}</div>`;
}

/* ---------------- máy quản trò ---------------- */
function renderNarrator(){
  const ph = S.phase, night = ph.startsWith('night');
  document.body.className = night ? 'night' : 'day';
  const icon = night ? '🌙' : ph === 'hunter_shot' ? '🏹' : ph === 'day_vote' || ph === 'verdict' ? '⚖️' : '☀️';
  const alive = S.players.filter(p => p.alive).length;
  app.innerHTML = `
    <div class="narr-stage"><div class="big">${icon}</div><h2>${phaseLabel(ph)}</h2>
      <span class="meta">${night ? 'Đêm' : 'Ngày'} ${Math.max(1, S.day)}, còn ${alive}/${S.players.length} người sống</span>
      <div class="narr-timer js-timer"></div></div>
    <div class="subtitle" id="subtitle">${esc(currentLine || '…')}</div>
    <div class="narr-tools">
      <button class="btn" data-do="repeat">🔁 Nhắc lại</button>
      <button class="btn" data-do="mute">${muted ? '🔈 Bật tiếng' : '🔇 Tắt tiếng'}</button></div>
    ${ph === 'day_discuss' ? chatter() : ''}
    ${ph === 'day_discuss' ? `<div style="margin-top:12px"><button class="btn primary" data-do="skipdisc">🗳️ Vote ngay</button>
      <p class="muted" style="text-align:center;margin-top:8px;font-size:14px">${S.ready.count}/${S.ready.need} người chơi đã bấm Vote ngay</p></div>` : ''}
    ${ph === 'day_vote' ? tally() : ''}
    ${voteToggle()}
    <button class="btn" data-do="cancel_game" style="margin-top:10px">⛔ Huỷ ván</button>
    ${scriptEditor()}
    <details class="log"><summary>Nhật ký công khai</summary>
      ${S.log.slice().reverse().map(l => `<p>${esc(l.text)}</p>`).join('')}</details>
    <button class="role-btn" id="roleBtn">Giữ để xem bài của mọi người</button>
    <div class="reveal ${revealing ? 'show' : ''}" id="reveal" style="justify-content:flex-start;overflow:auto">
      <h2 style="font-size:28px">Bài của mọi người</h2>
      <div class="roster" style="width:100%;max-width:420px;text-align:left">${S.players.map(p => `<div class="${p.alive ? '' : 'dead'}">
        <span>${esc(p.name)}</span><span>${RI(p.role)?.icon || ''} ${RI(p.role)?.name || ''}</span></div>`).join('')}</div></div>
    ${!audioReady && !muted ? `<div class="unlock"><div class="big" style="font-size:64px">🔊</div>
      <h2>Chạm để bật giọng quản trò</h2><p class="muted">Trình duyệt cần bạn chạm một lần mới cho phát âm thanh.</p>
      <button class="btn primary" data-do="unlock" style="max-width:320px">Bật âm thanh</button></div>` : ''}`;
}

function modePanel(){
  const bots = S.players.filter(p => p.bot).length, humans = S.players.length - bots;
  return `<div class="audio-box"><h3>Chế độ chơi</h3>
    <div class="seg" style="margin-bottom:10px">
      <button class="${bots ? '' : 'on'}" data-do="mode_online">🌐 Online</button>
      <button class="${bots ? 'on' : ''}" data-do="mode_bots">🤖 Có máy chơi</button></div>
    ${bots ? `<p>${humans} người thật + ${bots} máy chơi. Máy tự chọn mục tiêu ban đêm, lên tiếng lúc thảo luận và bỏ phiếu như người.</p>
      <div class="rrow" style="border:0;padding:4px 0"><span class="ricon">🤖</span><div class="rinfo"><b>Số máy chơi</b></div>
        <div class="stepper"><button data-do="bot_remove" aria-label="Bớt máy">−</button><output>${bots}</output>
        <button data-do="bot_add" aria-label="Thêm máy">+</button></div></div>
      <div class="presets">${[8, 10, 12, 16, 20].filter(n => n > humans).map(n => `<button data-fill="${n}">Lấp đủ ${n} người</button>`).join('')}</div>`
    : '<p>Chỉ người thật. Mọi người quét mã QR để vào phòng.</p>'}</div>`;
}

function audioPanel(){
  const opts = voices.map(v => `<option value="${esc(v.name)}" ${v.name === voiceName ? 'selected' : ''}>${esc(v.name)}</option>`).join('');
  return `<div class="audio-box"><h3>🎙️ Giọng quản trò</h3>
    <p>Máy này sẽ đọc lời dẫn. Đặt máy giữa bàn, bật âm lượng lớn và để màn hình luôn sáng.</p>
    ${voices.length ? `<select id="voice">${opts}</select>`
      : `<div class="warn">Chưa thấy giọng tiếng Việt trên máy này. iPhone: Cài đặt → Trợ năng → Nội dung được đọc → Giọng nói → Tiếng Việt, tải giọng "Linh". Android: cài Google Text-to-Speech và tải dữ liệu tiếng Việt.</div>`}
    <div class="opt" style="margin:6px 0 12px"><span>Tốc độ đọc</span><div class="seg">${[0.9, 1, 1.1].map(r =>
      `<button class="${rate === r ? 'on' : ''}" data-rate="${r}">${r === 1 ? 'Bình thường' : r < 1 ? 'Chậm' : 'Nhanh'}</button>`).join('')}</div></div>
    <button class="btn ${audioReady ? '' : 'primary'}" data-do="unlock">${audioReady ? '🔊 Nghe thử lại' : '🔊 Bật và nghe thử giọng'}</button></div>`;
}

/* ---------------- đồng hồ ---------------- */
function tick(){
  if (!S || !S.deadline) return;
  const s = Math.max(0, Math.ceil((S.deadline * 1000 - (Date.now() + clockOffset)) / 1000));
  document.querySelectorAll('.js-timer').forEach(el => {
    el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    el.classList.toggle('urgent', s <= 10);
  });
}
setInterval(tick, 250);

/* ---------------- tương tác ---------------- */
app.addEventListener('click', async e => {
  const b = e.target.closest('button, [data-do]'); if (!b || b.disabled) return;

  const A = S?.action;
  if (b.dataset.pick){
    const id = b.dataset.pick, max = A?.pick || 1;
    picks = picks.includes(id) ? picks.filter(x => x !== id) : [...picks, id].slice(-max);
    render(); return;
  }
  if (b.dataset.ack){ picks = []; act(b.dataset.ack, b.dataset.target || null); return; }
  if (b.dataset.toggle){
    const roles = {...S.settings.roles}, k = b.dataset.toggle;
    roles[k] = roles[k] ? 0 : 1;
    send({type:'settings', settings:{roles}}); return;
  }
  if (b.dataset.role){
    const roles = {...S.settings.roles};
    roles.werewolf = Math.max(0, Math.min(30, (roles.werewolf || 0) + Number(b.dataset.d)));
    send({type:'settings', settings:{roles}}); return;
  }
  if (b.dataset.preview){
    const ta = document.querySelector(`[data-script="${b.dataset.preview}"]`);
    previewSpeak(fillSample(ta ? ta.value : scriptText(b.dataset.preview))); return;
  }
  if (b.dataset.reset){ saveScript(b.dataset.reset, ''); return; }
  if (b.dataset.ph){
    const ta = document.querySelector(`[data-script="${b.dataset.for}"]`); if (!ta) return;
    const at = ta.selectionStart ?? ta.value.length, tag = `{${b.dataset.ph}}`;
    ta.value = ta.value.slice(0, at) + tag + ta.value.slice(ta.selectionEnd ?? at);
    ta.focus(); ta.selectionStart = ta.selectionEnd = at + tag.length;
    saveScript(b.dataset.for, ta.value); return;
  }
  if (b.dataset.cedit){
    const d = S.settings.custom_roles[b.dataset.cedit];
    editingRole = {id: b.dataset.cedit, ...d, uses: String(d.uses), start_night: String(d.start_night)}; render(); return;
  }
  if (b.dataset.cn){
    const roles = {...S.settings.roles}, k = b.dataset.cn;
    roles[k] = Math.max(0, Math.min(5, (roles[k] || 0) + Number(b.dataset.d)));
    send({type:'settings', settings:{roles}}); return;
  }
  if (b.dataset.crt && editingRole){ editingRole[b.dataset.crt] = !editingRole[b.dataset.crt]; render(); return; }
  if (b.dataset.crteam && editingRole){ editingRole.team = b.dataset.crteam; render(); return; }
  if (b.dataset.cri && editingRole){ editingRole.icon = b.dataset.cri; render(); return; }
  if (b.dataset.panel){ openPanel(b.dataset.panel); return; }
  if (b.dataset.tab){ hostTab = b.dataset.tab; save('masoi_host_tab', hostTab); render(); window.scrollTo({top: 0}); return; }
  if (b.dataset.cycle){
    const t = TIMERS.find(x => x[0] === b.dataset.cycle), opts = t[3], cur = S.settings[t[0]];
    let k = opts.indexOf(cur); if (k < 0) k = opts.findIndex(v => v >= cur);
    k = Math.max(0, Math.min(opts.length - 1, k + Number(b.dataset.d)));
    send({type:'settings', settings:{[t[0]]: opts[k]}}); return;
  }
  if (b.dataset.do === 'bot_step'){ send({type:'bots', op: Number(b.dataset.d) > 0 ? 'add' : 'remove'}); return; }
  if (b.dataset.fill){ send({type:'bots', op:'fill', n:Number(b.dataset.fill)}); return; }
  if (b.dataset.rate){ rate = Number(b.dataset.rate); save('masoi_rate', rate); render(); return; }
  if (b.dataset.set){ send({type:'settings', settings:{[b.dataset.set]: Number(b.dataset.v)}}); return; }

  const name = () => { const v = $('#name').value.trim(); if (!v) throw new Error('Hãy nhập tên của bạn'); save('masoi_name', v); return v; };
  try {
    switch (b.dataset.do){
      case 'create': session = await api('/api/rooms', {name:name()}); break;
      case 'create_bots': session = await api('/api/rooms', {name:name()}); pendingBots = true; unlockAudio(); break;
      case 'mode_online': send({type:'bots', op:'fill', n: S.players.filter(p => !p.bot).length}); return;
      case 'mode_bots': send({type:'bots', op:'fill', n: Math.max(8, S.players.length + 1)}); return;
      case 'bot_add': send({type:'bots', op:'add'}); return;
      case 'bot_remove': send({type:'bots', op:'remove'}); return;
      case 'host_voice': {
        const on = !S.settings.host_voice;
        if (on) unlockAudio();
        send({type:'settings', settings:{host_voice: on}}); return;
      }
      case 'create_narrator': {
        const v = $('#name').value.trim();
        session = await api('/api/rooms', {name:v ? `🎙️ ${v}` : 'Quản trò', narrator:true});
        unlockAudio(); break;
      }
      case 'unlock': unlockAudio(); render(); return;
      case 'reset_all_scripts': {
        const all = {}; Object.keys(S.script_defaults).forEach(k => all[k] = '');
        save('masoi_scripts', {}); send({type:'settings', settings:{scripts: all}}); return;
      }
      case 'repeat': if (currentLine){ speakQueue.unshift(currentLine); pump(); } return;
      case 'mute': muted = !muted; if (muted) tts?.cancel(); speaking = false; render(); pump(); return;
      case 'replay_recap': {
        stopSpeech();
        const lines = ['Diễn biến ván chơi.'];
        let period = null;
        for (const h of S.history){ if (h.period !== period){ period = h.period; lines.push(period + '.'); } lines.push(h.text); }
        speakQueue.push(...lines); pump(); return;
      }
      case 'join': {
        const code = $('#code').value.trim().toUpperCase();
        if (code.length !== 4) throw new Error('Mã phòng gồm 4 chữ cái');
        session = await api(`/api/rooms/${code}/join`, {name:name()}); break;
      }
      case 'copy': {
        const url = invite?.url || `${location.origin}/?room=${S.code}`;
        const text = `Vào chơi Ma Sói – mã phòng ${S.code}: ${url}`;
        try { await navigator.clipboard.writeText(text); toast('✓ Đã sao chép mã phòng và link'); }
        catch { toast(text); }
        return;
      }
      case 'share': {
        const url = invite?.url || `${location.origin}/?room=${S.code}`;
        // Trên http:// (mạng LAN) trình duyệt thường tắt share/clipboard
        if (navigator.share) await navigator.share({title:'Vào chơi Ma Sói', text:`Mã phòng ${S.code}`, url}).catch(() => {});
        else if (navigator.clipboard) { await navigator.clipboard.writeText(url); toast('Đã sao chép link mời'); }
        else toast(`Gửi link này cho mọi người: ${url}`);
        return;
      }
      case 'qrbig': qrFull = true; render(); return;
      case 'qrclose': qrFull = false; render(); return;
      case 'nextip': await loadInvite((invite.index + 1) % invite.count); toast('Đã đổi sang địa chỉ khác, thử quét lại'); return;
      case 'nolink': history.replaceState(null, '', '/'); render(); return;
      case 'auto': send({type:'settings', settings:{auto_roles:true}}); return;
      case 'basic': send({type:'settings', settings:{roles:{werewolf:Math.max(1, Math.floor(S.players.length / 4)),
        seer:1, bodyguard:1, witch:1, hunter:1}}}); return;
      case 'allroles': {
        const roles = {werewolf:Math.max(1, Math.floor(S.players.length / 4) - 3)};
        Object.keys(ROLE).forEach(k => { if (k !== 'werewolf' && k !== 'villager') roles[k] = 1; });
        send({type:'settings', settings:{roles}}); return;
      }
      case 'reveal': send({type:'settings', settings:{reveal_role_on_death: !S.settings.reveal_role_on_death}}); return;
      case 'fast': send({type:'settings', settings:{fast_turns: !S.settings.fast_turns}}); return;
      case 'start': send({type:'start'}); return;
      case 'restart': stopSpeech(); send({type:'restart'}); return;
      case 'new_game': stopSpeech(); send({type:'new_game'}); return;
      case 'reset_scores':
        if (confirm('Xoá toàn bộ bảng xếp hạng của phòng?')) send({type:'reset_scores'});
        return;
      case 'menu': menuOpen = true; render(); return;
      case 'menu_close': menuOpen = false; render(); return;
      case 'panel_back': hostPanel = null; render(); return;
      case 'cr_new':
        editingRole = {id:null, name:'', icon:'⭐', team:'village', action:'protect', uses:'0', start_night:'1',
                       no_repeat:false, tough:false, revenge:false, seen_as:'', desc:'', call:''};
        render(); return;
      case 'cr_cancel': editingRole = null; render(); return;
      case 'cr_save': saveCustomRole(); render(); return;
      case 'cr_delete': {
        const id = editingRole.id;
        if (!confirm('Xoá vai này khỏi phòng và khỏi máy?')) return;
        const lib = crLib(); delete lib[id]; save('masoi_custom_roles', lib);
        send({type:'settings', settings:{custom_roles:{[id]: null}}});
        editingRole = null; render(); return;
      }
      case 'defaults':
        send({type:'settings', settings:{auto_roles:true, creator_seconds:30, wolves_seconds:20, role_seconds:5,
          hunter_seconds:15, discuss_seconds:180, vote_seconds:60, reveal_role_on_death:true, fast_turns:true, show_votes:false}});
        toast('Đã trả về cấu hình mặc định'); return;
      case 'show_votes': send({type:'settings', settings:{show_votes: !S.settings.show_votes}}); return;
      case 'cancel_game':
        if (confirm('Huỷ ván đang chơi? Mọi người sẽ quay lại phòng chờ.')) send({type:'cancel_game'});
        return;
      case 'ready_next': send({type:'ready_next'}); return;
      case 'leave':
        stopSpeech();
        if (S && (S.phase === 'lobby' || S.phase === 'ended')) send({type:'leave'});
        session = null; S = null; save('masoi_session', null); ws?.close(); render(); return;
      case 'skipdisc': act('skip_discussion'); return;
      case 'vote_skip': picks = []; act('vote', 'skip'); return;
      case 'confirm':
        act(b.dataset.act || A.act, A.pick > 1 ? picks : picks[0]); picks = []; return;
      default: return;
    }
    save('masoi_session', session); history.replaceState(null, '', '/'); connect();
  } catch (err) { toast(err.message); }
});

app.addEventListener('toggle', e => { if (e.target.id === 'scriptEditor') editorOpen = e.target.open; }, true);
app.addEventListener('input', e => {
  if (e.target.dataset?.cr && editingRole){ editingRole[e.target.dataset.cr] = e.target.value; return; }
  const key = e.target.dataset?.script; if (!key) return;
  clearTimeout(saveTimer); saveTimer = setTimeout(() => saveScript(key, e.target.value), 800);
});
app.addEventListener('focusout', e => {
  if (e.target.closest?.('#roleForm')){
    // chờ một chút để cú chạm vào nút trong form không bị mất khi giao diện vẽ lại
    setTimeout(() => { if (pendingRender && !document.activeElement?.closest?.('#roleForm')){ pendingRender = false; render(); } }, 400);
    return;
  }
  const key = e.target.dataset?.script; if (!key) return;
  clearTimeout(saveTimer); saveScript(key, e.target.value);
  setTimeout(() => { if (pendingRender && !document.activeElement?.dataset?.script){ pendingRender = false; render(); } }, 50);
});
app.addEventListener('change', e => {
  if (e.target.dataset?.cr && editingRole){
    editingRole[e.target.dataset.cr] = e.target.value;
    if (e.target.tagName === 'SELECT'){ e.target.blur(); render(); }   // ô chữ: không vẽ lại để cú chạm kế tiếp không bị mất
    return;
  }
  if (e.target.id === 'voice'){ voiceName = e.target.value; save('masoi_voice', voiceName); unlockAudio(); }
});

/* Giữ nút để xem vai – thả tay là che đi, an toàn khi ngồi cạnh nhau */
document.addEventListener('pointerdown', e => {
  if (e.target.closest('#roleBtn')){ e.preventDefault(); revealing = true; $('#reveal')?.classList.add('show'); }
});
['pointerup','pointercancel','blur'].forEach(ev => window.addEventListener(ev, () => {
  if (revealing){ revealing = false; $('#reveal')?.classList.remove('show'); }
}));
document.addEventListener('contextmenu', e => { if (e.target.closest('#roleBtn')) e.preventDefault(); });

if (session) connect(); render();
</script>
</body>
</html>
